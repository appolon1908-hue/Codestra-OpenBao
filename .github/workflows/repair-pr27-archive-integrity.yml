name: One-shot repair for PR 27 sanitized Raft archive integrity

on:
  push:
    branches:
      - sync/openbao-upstream-dd9c19c37a878cf4a81b18efb8d6f0599c7da923-79016e7d0a693149fde2878f09ff9861011e66a3
    paths:
      - .github/workflows/repair-pr27-archive-integrity.yml

permissions:
  contents: write

concurrency:
  group: repair-pr27-sanitized-raft-archive-integrity
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT_SHA: ca28e1f1fec2e18648c6d4c1ab471c94664b7d92
      BRANCH_NAME: sync/openbao-upstream-dd9c19c37a878cf4a81b18efb8d6f0599c7da923-79016e7d0a693149fde2878f09ff9861011e66a3
      ARCHIVE_PATH: upstream/physical/raft/snapshot/testdata/spaces-meta.tar
      LOCK_PATH: CODESTRA_UPSTREAM_LOCK.json
      OLD_STATE_SHA256: aa73f76d409d148bae2d7263544633647fc0a8b52c416ea2e7c22c3e77a8d272
      EXPECTED_SANITIZED_STATE_SHA256: 23da5e3443ff61c0463ade613f319bb1796f5d98e6db5a79eff3ebf5b36fd075
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact workflow-only trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT_SHA" ]]
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT_SHA"..HEAD)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == ".github/workflows/repair-pr27-archive-integrity.yml" ]]
          [[ "${GITHUB_REF_NAME}" == "$BRANCH_NAME" ]]

      - name: Set up exact upstream Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: upstream/.go-version
          cache: false

      - name: Repair and prove archive integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import tarfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE_PATH"])
          lock_path = Path(os.environ["LOCK_PATH"])
          old_digest = os.environ["OLD_STATE_SHA256"]
          expected_digest = os.environ["EXPECTED_SANITIZED_STATE_SHA256"]
          old_line = f"{old_digest}  state.bin".encode("ascii")

          def inspect(payload: bytes):
              with tarfile.open(fileobj=io.BytesIO(payload), mode="r:") as bundle:
                  members = bundle.getmembers()
                  metadata = [
                      (
                          member.name,
                          member.mode,
                          member.uid,
                          member.gid,
                          member.uname,
                          member.gname,
                          member.mtime,
                          member.size,
                          member.type,
                          dict(member.pax_headers),
                      )
                      for member in members
                  ]
                  files = {
                      member.name: bundle.extractfile(member).read()
                      for member in members
                      if member.isfile()
                  }
              return metadata, files

          before = archive.read_bytes()
          before_sha = hashlib.sha256(before).hexdigest()
          if before.count(old_line) != 1:
              raise SystemExit("expected exactly one stale embedded state.bin digest")
          before_metadata, before_files = inspect(before)
          if list(before_files) != ["meta.json", "SHA256SUMS", "state.bin"]:
              raise SystemExit(f"unexpected archive member order: {list(before_files)}")

          state_digest = hashlib.sha256(before_files["state.bin"]).hexdigest()
          if state_digest != expected_digest:
              raise SystemExit(
                  f"sanitized state.bin digest drift: expected={expected_digest} actual={state_digest}"
              )
          new_line = f"{state_digest}  state.bin".encode("ascii")
          if len(new_line) != len(old_line):
              raise SystemExit("same-length checksum repair invariant failed")

          after = before.replace(old_line, new_line, 1)
          if len(after) != len(before):
              raise SystemExit("archive byte length changed")
          archive.write_bytes(after)

          after_sha = hashlib.sha256(after).hexdigest()
          after_metadata, after_files = inspect(after)
          if after_metadata != before_metadata:
              raise SystemExit("archive member metadata changed")
          if after_files["meta.json"] != before_files["meta.json"]:
              raise SystemExit("meta.json changed")
          if after_files["state.bin"] != before_files["state.bin"]:
              raise SystemExit("state.bin changed")

          checksums: dict[str, str] = {}
          for line in after_files["SHA256SUMS"].decode("ascii").splitlines():
              digest, name = line.split("  ", 1)
              checksums[name] = digest
          if set(checksums) != {"meta.json", "state.bin"}:
              raise SystemExit(f"unexpected checksum member set: {set(checksums)}")
          for name, digest in checksums.items():
              actual = hashlib.sha256(after_files[name]).hexdigest()
              if actual != digest:
                  raise SystemExit(
                      f"embedded checksum mismatch after repair: member={name} expected={digest} actual={actual}"
                  )

          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          repair = {
              "archive": archive.as_posix(),
              "member": "state.bin",
              "reason": "recompute embedded SHA256SUMS after deterministic private-key fixture sanitization",
              "stale_embedded_sha256": old_digest,
              "sanitized_member_sha256": state_digest,
              "archive_sha256_before": before_sha,
              "archive_sha256_after": after_sha,
              "archive_size_preserved": True,
              "member_order_and_metadata_preserved": True,
              "member_payloads_changed": ["SHA256SUMS"],
              "focused_test": "go test ./physical/raft/snapshot -run ^TestArchive_GoodData$ -count=1",
              "secret_values_recorded": False,
          }
          repairs = [
              item
              for item in lock.get("archive_integrity_repairs", [])
              if not (
                  item.get("archive") == repair["archive"]
                  and item.get("member") == repair["member"]
              )
          ]
          repairs.append(repair)
          lock["archive_integrity_repairs"] = repairs
          lock["archive_integrity_verified"] = True
          lock_path.write_text(
              json.dumps(lock, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(f"ARCHIVE_SHA256_BEFORE={before_sha}")
          print(f"ARCHIVE_SHA256_AFTER={after_sha}")
          print(f"SANITIZED_STATE_SHA256={state_digest}")
          print("UPSTREAM_ARCHIVE_EMBEDDED_CHECKSUMS=PASS")
          PY

      - name: Run focused upstream archive regression
        working-directory: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          go test ./physical/raft/snapshot -run '^TestArchive_GoodData$' -count=1

      - name: Reject secret material after repair
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/reject_repository_secrets.sh upstream

      - name: Commit only repaired archive evidence and remove writer
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/repair-pr27-archive-integrity.yml
          git rm -- "$workflow"
          git add -f -- "$ARCHIVE_PATH"
          git add -- "$LOCK_PATH"
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/repair-pr27-archive-integrity.yml",
              "CODESTRA_UPSTREAM_LOCK.json",
              "upstream/physical/raft/snapshot/testdata/spaces-meta.tar",
          }
          staged = {
              raw.decode("utf-8")
              for raw in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only", "-z"]
              ).split(b"\0")
              if raw
          }
          if staged != expected:
              raise SystemExit(
                  f"repair staged-path boundary failed: expected={sorted(expected)} actual={sorted(staged)}"
              )
          PY

          git config user.name "codestra-upstream-repair"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: repair sanitized Raft snapshot checksum"
          [[ "$(git rev-parse HEAD^^)" == "$EXPECTED_PARENT_SHA" ]]
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
