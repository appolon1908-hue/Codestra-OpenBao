name: One-shot OpenBao archive integrity remediation

on:
  push:
    branches:
      - sync/openbao-upstream-dd9c19c37a878cf4a81b18efb8d6f0599c7da923-79016e7d0a693149fde2878f09ff9861011e66a3
    paths:
      - .github/workflows/remediate-upstream-archive-integrity.yml

permissions:
  contents: write

concurrency:
  group: one-shot-openbao-archive-integrity-remediation
  cancel-in-progress: false

jobs:
  patch-importer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic importer remediation
        run: python3 scripts/apply_archive_importer_remediation.py

      - name: Validate archive repair and importer wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/repair_upstream_archive_integrity.py tests/security/test_upstream_archive_integrity.py
          python3 -m unittest tests.security.test_upstream_archive_integrity -v
          python3 scripts/repair_upstream_archive_integrity.py --check >/tmp/openbao-archive-integrity.json
          grep -Fq "from repair_upstream_archive_integrity import repair_known_upstream_archives" .github/workflows/upstream-source-sync.yml
          grep -Fq "'archive_integrity_repairs': archive_integrity_repairs" .github/workflows/upstream-source-sync.yml
          grep -Fq "'archive_integrity_verified': all(" .github/workflows/upstream-source-sync.yml
          git diff --check

      - name: Commit exact remediation and remove one-shot files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/remediate-upstream-archive-integrity.yml
          rm scripts/apply_archive_importer_remediation.py
          git config user.name codestra-openbao-remediation
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(openbao): persist archive-aware upstream checksum repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
