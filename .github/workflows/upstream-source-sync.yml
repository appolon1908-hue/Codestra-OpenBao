name: Codestra Upstream Source Sync

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - .github/workflows/upstream-source-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codestra-upstream-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Codestra authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Import official upstream source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url'])
          print(data['upstream_ref'])
          print(data['import_path'])
          PY
          )

          UPSTREAM_URL="${values[0]}"
          UPSTREAM_REF="${values[1]}"
          IMPORT_PATH="${values[2]}"

          [[ "$UPSTREAM_URL" == "https://github.com/openbao/openbao.git" ]] || exit 2
          [[ "$UPSTREAM_REF" == "main" ]] || exit 2
          [[ "$IMPORT_PATH" == "upstream" ]] || exit 2

          rm -rf .codestra-upstream-src "$IMPORT_PATH"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" .codestra-upstream-src
          UPSTREAM_SHA="$(git -C .codestra-upstream-src rev-parse HEAD)"
          rm -rf .codestra-upstream-src/.git
          mv .codestra-upstream-src "$IMPORT_PATH"

          export UPSTREAM_URL UPSTREAM_REF UPSTREAM_SHA
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          sanitizations=[]

          def sanitize(path, replacements, rule):
              p=Path(path)
              if not p.exists():
                  return
              text=p.read_text(errors='surrogateescape')
              original=text
              count=0
              for pattern,repl in replacements:
                  text,n=re.subn(pattern,repl,text)
                  count += n
              if text != original:
                  p.write_text(text, errors='surrogateescape')
                  sanitizations.append({'rule':rule,'files_changed':1,'replacements':count,'path':path})

          sanitize(
              'upstream/ui/tests/unit/lib/console-helpers-test.js',
              [
                  (r'AKIA[0-9A-Z]{16}', 'AWS_ACCESS_KEY_ID_TEST_INVALID'),
                  (r'(?i)(aws_secret_access_key[\"\']?\s*[:=]\s*[\"\']?)[A-Za-z0-9/+=]{20,}', r'\1AWS_SECRET_ACCESS_KEY_TEST_INVALID'),
              ],
              'replace AWS credential-shaped upstream UI test fixtures with explicit invalid placeholders'
          )

          vault_patterns=[
              (r'(?<![A-Za-z0-9])(?:hvs|hvr|hvb|hvp)\.[A-Za-z0-9_-]{12,}', 'OPENBAO_SERVICE_TOKEN_TEST_INVALID'),
              (r'(?<![A-Za-z0-9])s\.[A-Za-z0-9_-]{16,}', 'OPENBAO_SERVICE_TOKEN_TEST_INVALID'),
          ]
          for path in [
              'upstream/website/content/docs/api/system/mfa-validate.mdx',
              'upstream/website/content/docs/agent-and-proxy/agent/caching/index.mdx',
              'upstream/website/content/docs/agent-and-proxy/proxy/caching/index.mdx',
              'upstream/website/content/docs/api/auth/userpass.mdx',
          ]:
              sanitize(path, vault_patterns, 'replace Vault/OpenBao token-shaped upstream documentation examples with explicit invalid placeholders')

          lock = {
              'schema_version': '1.0',
              'upstream_clone_url': os.environ['UPSTREAM_URL'],
              'upstream_ref': os.environ['UPSTREAM_REF'],
              'upstream_commit': os.environ['UPSTREAM_SHA'],
              'import_path': 'upstream',
              'synchronized_at': datetime.now(timezone.utc).isoformat(),
              'deployment_enabled': False,
              'secret_material_allowed_in_git': False,
          }
          if sanitizations:
              lock['sanitizations']=sanitizations
          Path('CODESTRA_UPSTREAM_LOCK.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY

          git config user.name 'codestra-upstream-sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A upstream CODESTRA_UPSTREAM_LOCK.json
          git diff --cached --quiet && exit 0
          git commit -m "vendor: sync official OpenBao upstream ${UPSTREAM_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:staging
          git push origin HEAD:production
