name: Validate workload secret authority

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBAO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  OPENBAO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  workload-secret-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPENBAO_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$OPENBAO_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate authority and mutation coverage
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 scripts/validate_workload_secret_authority.py
          python3 -m unittest -v tests.test_workload_secret_authority

      - name: Reject secrets across exact commit range
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          set -euo pipefail
          scan_base="$OPENBAO_BASE_SHA"
          if [ -z "$scan_base" ] || [ "$scan_base" = "0000000000000000000000000000000000000000" ]; then
            scan_base="${OPENBAO_SOURCE_SHA}^"
          fi
          git cat-file -e "${scan_base}^{commit}"
          test -d "$PWD/.git"
          test ! -L "$PWD/.git"
          test "$(git rev-list --count "${scan_base}..${OPENBAO_SOURCE_SHA}")" -ge 1
          docker run --rm --volume "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git --redact --no-banner \
            --log-opts="${scan_base}..${OPENBAO_SOURCE_SHA}" /repo

      - name: Reject whitespace errors in committed source
        run: |
          set -euo pipefail
          base_sha="$OPENBAO_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="${OPENBAO_SOURCE_SHA}^"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git diff --check "$base_sha" "$OPENBAO_SOURCE_SHA"
