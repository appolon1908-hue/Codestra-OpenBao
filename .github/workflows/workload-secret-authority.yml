name: Validate workload secret authority

on:
  pull_request:
    paths:
      - config/workload-secret-authority.v1.json
      - docs/CODESTRA-SECRETS-AUTHORITY.md
      - scripts/validate_workload_secret_authority.py
      - tests/test_workload_secret_authority.py
      - .github/workflows/workload-secret-authority.yml
  push:
    branches: [main]
    paths:
      - config/workload-secret-authority.v1.json
      - docs/CODESTRA-SECRETS-AUTHORITY.md
      - scripts/validate_workload_secret_authority.py
      - tests/test_workload_secret_authority.py
      - .github/workflows/workload-secret-authority.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBAO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  workload-secret-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPENBAO_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$OPENBAO_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: false

      - name: Validate authority and mutation coverage
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 scripts/validate_workload_secret_authority.py
          python3 -m unittest -v tests.test_workload_secret_authority

      - name: Reject committed secrets in exact source
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          docker run --rm --volume "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            dir --redact --no-banner /repo

      - name: Reject whitespace errors
        run: git diff --check
