name: Validate workload secret authority

on:
  pull_request: {}
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBAO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  OPENBAO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  trusted-source-security:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out untrusted candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPENBAO_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: trusted

      - name: Verify exact source identity
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$OPENBAO_SOURCE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          test "$(git -C trusted rev-parse HEAD)" = \
            "${{ github.event.pull_request.base.sha || github.sha }}"
          test -z "$(git -C trusted status --porcelain)"

      - name: Reject secrets across exact commit range
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          set -euo pipefail
          scan_base="$OPENBAO_BASE_SHA"
          if [ -z "$scan_base" ] || [ "$scan_base" = "0000000000000000000000000000000000000000" ]; then
            scan_base="${OPENBAO_SOURCE_SHA}^"
          fi
          git -C candidate cat-file -e "${scan_base}^{commit}"
          test -d "$PWD/candidate/.git"
          test ! -L "$PWD/candidate/.git"
          test "$(git -C candidate rev-list --count "${scan_base}..${OPENBAO_SOURCE_SHA}")" -ge 1
          docker run --rm \
            --volume "$PWD/candidate:/repo:ro" \
            --volume "$PWD/trusted:/trusted:ro" \
            "$GITLEAKS_IMAGE" \
            --config=/trusted/.github/gitleaks-trusted.toml \
            --gitleaks-ignore-path=/trusted/.github/gitleaks-trusted.ignore \
            --ignore-gitleaks-allow \
            git --redact --no-banner \
            --log-opts="${scan_base}..${OPENBAO_SOURCE_SHA} --diff-merges=first-parent" /repo

      - name: Reject whitespace errors in committed source
        run: |
          set -euo pipefail
          base_sha="$OPENBAO_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="${OPENBAO_SOURCE_SHA}^"
          fi
          git -C candidate cat-file -e "${base_sha}^{commit}"
          git -C candidate diff --check "$base_sha" "$OPENBAO_SOURCE_SHA"

      - name: Set up pinned Python for trusted validator
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate candidate policy with trusted base code
        run: |
          set -euo pipefail
          test -f candidate/config/workload-secret-authority.v1.json
          test ! -L candidate/config/workload-secret-authority.v1.json
          python3 trusted/scripts/validate_workload_secret_authority.py \
            --policy candidate/config/workload-secret-authority.v1.json

  candidate-source-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPENBAO_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$OPENBAO_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Scan exact candidate commit range
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          set -euo pipefail
          scan_base="$OPENBAO_BASE_SHA"
          if [ -z "$scan_base" ] || [ "$scan_base" = "0000000000000000000000000000000000000000" ]; then
            scan_base="${OPENBAO_SOURCE_SHA}^"
          fi
          git cat-file -e "${scan_base}^{commit}"
          test -d "$PWD/.git"
          test ! -L "$PWD/.git"
          test "$(git rev-list --count "${scan_base}..${OPENBAO_SOURCE_SHA}")" -ge 1
          docker run --rm --volume "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            --config=/repo/.github/gitleaks-trusted.toml \
            --gitleaks-ignore-path=/repo/.github/gitleaks-trusted.ignore \
            --ignore-gitleaks-allow \
            git --redact --no-banner \
            --log-opts="${scan_base}..${OPENBAO_SOURCE_SHA} --diff-merges=first-parent" /repo
          git diff --check "$scan_base" "$OPENBAO_SOURCE_SHA"

  candidate-validation:
    if: github.event_name == 'pull_request'
    needs: candidate-source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPENBAO_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$OPENBAO_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate authority and mutation coverage
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 scripts/validate_workload_secret_authority.py
          python3 -m unittest -v tests.test_workload_secret_authority
